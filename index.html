<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17301F">
<title>Cotton Leaf Check</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--ink:#17301F;--bg:#EEF2EC;--card:#fff;--btn:#1F5C3A;--mute:#5B6B60;--line:#D5DDD3;--s0:#2E7D4F;--s1:#B58900;--s2:#D9731A;--s3:#B3261E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Kannada","Nirmala UI","Kannada Sangam MN",sans-serif}
header{background:var(--ink);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:1.25rem;font-weight:700}
.lang button{background:none;border:1px solid #6f8f78;color:#cfe0d3;padding:6px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.lang button:first-child{border-radius:8px 0 0 8px}.lang button:last-child{border-radius:0 8px 8px 0;border-left:0}
.lang button[aria-pressed=true]{background:#fff;color:var(--ink)}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.btn{flex:1 1 180px;padding:14px 16px;border-radius:10px;border:2px solid var(--btn);font:inherit;font-weight:600;cursor:pointer;text-align:center}
.btn.p{background:var(--btn);color:#fff}.btn.s{background:#fff;color:var(--btn)}
.btn:disabled{opacity:.5;cursor:wait}
.btn:focus-visible,.lang button:focus-visible{outline:3px solid #7CC59A;outline-offset:2px}
.mute{color:var(--mute);font-size:.92rem;margin:6px 0}
.chip{display:inline-block;font-size:.85rem;padding:3px 10px;border-radius:99px;background:#E2EBE1;color:var(--ink)}
.chip.ok{background:#CFE8D7}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imgs figure{margin:0}.imgs canvas{width:100%;height:auto;aspect-ratio:1;border-radius:8px;background:#ddd;display:block}
figcaption{font-size:.85rem;color:var(--mute);margin-top:4px}
.name{font-size:1.6rem;font-weight:700;margin:0}
.sev{border-radius:10px;padding:14px;color:#fff;margin:12px 0}
.sev b{font-size:1.3rem}
.steps{display:flex;gap:4px;margin-top:10px}.steps i{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.35)}.steps i.on{background:#fff}
.alt{display:grid;grid-template-columns:130px 1fr 48px;gap:8px;align-items:center;font-size:.92rem;margin:4px 0}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--btn)}
.warn{background:#FFF3D6;border:1px solid #E5C877;border-radius:8px;padding:10px;margin:10px 0}
[hidden]{display:none!important}
@media(min-width:700px){.res{display:grid;grid-template-columns:1fr 1fr;gap:18px}}
</style>
</head>
<body>
<header>
  <h1 id="t_title"></h1>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="en" aria-pressed="true">English</button><button data-l="kn" aria-pressed="false">ಕನ್ನಡ</button>
  </div>
</header>
<main>
  <section class="card">
    <p id="t_intro" style="margin:0"></p>
    <div class="row">
      <button class="btn p" id="camBtn" disabled></button>
      <button class="btn s" id="galBtn" disabled></button>
    </div>
    <p class="mute" id="t_tip"></p>
    <p><span class="chip" id="status"></span> <button class="btn s" id="installBtn" hidden style="flex:none;padding:6px 14px"></button></p>
    <p class="mute" id="iosHint" hidden></p>
    <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
    <input type="file" id="galIn" accept="image/*" hidden>
  </section>
  <section class="card" id="busy" hidden><b id="t_busy"></b></section>
  <section class="card" id="result" hidden>
    <div class="res">
      <div class="imgs">
        <figure><canvas id="cPhoto" width="224" height="224"></canvas><figcaption id="t_photo"></figcaption></figure>
        <figure><canvas id="cMask" width="224" height="224"></canvas><figcaption id="t_mask"></figcaption></figure>
      </div>
      <div>
        <p class="name" id="rName"></p>
        <p class="mute" id="rConf"></p>
        <div class="sev" id="rSev"><b id="rLevel"></b><div id="rPct"></div><div class="steps"><i></i><i></i><i></i><i></i></div></div>
        <p id="rAdvice" style="margin:8px 0"></p>
        <div class="warn" id="rLow" hidden></div>
      </div>
    </div>
    <p class="mute" style="margin-top:14px" id="t_alt"></p>
    <div id="rAlt"></div>
    <p class="mute" id="t_disc" style="margin-top:12px"></p>
  </section>
</main>
<script src="lib/tf.min.js"></script>
<script src="core.js"></script>
<script>
const T={
en:{title:'Cotton Leaf Check',intro:'Photograph a cotton leaf to find the disease and how badly it is affected. Works without internet.',cam:'Take photo',gal:'Choose from gallery',tip:'Keep one leaf in the frame, in daylight.',
 loading:'Loading model…',ready:'Ready offline',readyOnline:'Ready',busy:'Analysing…',conf:'Confidence',affected:'of leaf area affected',alt:'Other possibilities',photo:'Photo',mask:'Affected area (red)',
 low:'Not sure about this one. Retake in daylight with the leaf filling the frame.',disc:'This is an AI estimate. Confirm with your local agriculture officer before treating.',install:'Install app',ios:'To install: tap Share, then Add to Home Screen.',err:'Could not read this image. Try another photo.',
 sev:['Healthy','Mild','Moderate','Severe'],lv:'Severity level',
 cls:{'Aphids':'Aphids','Army worm':'Army worm','Bacterial Blight':'Bacterial blight','Healthy':'Healthy leaf','Powdery Mildew':'Powdery mildew','Target spot':'Target spot'},
 adv:{'Aphids':'Check the underside of leaves. Remove badly infested leaves and ask your agriculture officer about control.','Army worm':'Look for caterpillars and chewed leaves, mostly at dusk. Ask your agriculture officer about control.','Bacterial Blight':'Avoid working in wet fields and remove badly infected leaves. Ask your agriculture officer about treatment.','Healthy':'No disease found. Keep checking regularly.','Powdery Mildew':'Improve air flow and avoid overcrowding. Ask your agriculture officer about treatment.','Target spot':'Remove badly spotted leaves and keep foliage dry. Ask your agriculture officer about treatment.'}},
kn:{title:'ಹತ್ತಿ ಎಲೆ ತಪಾಸಣೆ',intro:'ಹತ್ತಿ ಎಲೆಯ ಫೋಟೋ ತೆಗೆದರೆ ರೋಗ ಮತ್ತು ಅದರ ತೀವ್ರತೆ ತಿಳಿಯುತ್ತದೆ. ಇಂಟರ್ನೆಟ್ ಇಲ್ಲದೆಯೂ ಕೆಲಸ ಮಾಡುತ್ತದೆ.',cam:'ಫೋಟೋ ತೆಗೆಯಿರಿ',gal:'ಗ್ಯಾಲರಿಯಿಂದ ಆರಿಸಿ',tip:'ಹಗಲಿನ ಬೆಳಕಿನಲ್ಲಿ, ಒಂದು ಎಲೆ ಚೌಕಟ್ಟಿನಲ್ಲಿ ಬರುವಂತೆ ಫೋಟೋ ತೆಗೆಯಿರಿ.',
 loading:'ಮಾದರಿ ಲೋಡ್ ಆಗುತ್ತಿದೆ…',ready:'ಆಫ್‌ಲೈನ್ ಸಿದ್ಧ',readyOnline:'ಸಿದ್ಧ',busy:'ವಿಶ್ಲೇಷಿಸಲಾಗುತ್ತಿದೆ…',conf:'ವಿಶ್ವಾಸಾರ್ಹತೆ',affected:'ಎಲೆಯ ಭಾಗ ಬಾಧಿತ',alt:'ಇತರ ಸಾಧ್ಯತೆಗಳು',photo:'ಫೋಟೋ',mask:'ಬಾಧಿತ ಭಾಗ (ಕೆಂಪು)',
 low:'ಖಚಿತವಿಲ್ಲ. ಹಗಲಿನ ಬೆಳಕಿನಲ್ಲಿ, ಎಲೆ ಪೂರ್ಣ ಚೌಕಟ್ಟಿನಲ್ಲಿ ಬರುವಂತೆ ಮತ್ತೆ ಫೋಟೋ ತೆಗೆಯಿರಿ.',disc:'ಇದು AI ಅಂದಾಜು. ಚಿಕಿತ್ಸೆಗೆ ಮೊದಲು ಸ್ಥಳೀಯ ಕೃಷಿ ಅಧಿಕಾರಿಯಿಂದ ಖಚಿತಪಡಿಸಿಕೊಳ್ಳಿ.',install:'ಆ್ಯಪ್ ಇನ್‌ಸ್ಟಾಲ್ ಮಾಡಿ',ios:'ಇನ್‌ಸ್ಟಾಲ್ ಮಾಡಲು: ಶೇರ್ ಒತ್ತಿ, ನಂತರ ಹೋಮ್ ಸ್ಕ್ರೀನ್‌ಗೆ ಸೇರಿಸಿ ಆರಿಸಿ.',err:'ಈ ಚಿತ್ರವನ್ನು ಓದಲಾಗಲಿಲ್ಲ. ಬೇರೆ ಫೋಟೋ ಪ್ರಯತ್ನಿಸಿ.',
 sev:['ಆರೋಗ್ಯಕರ','ಸೌಮ್ಯ','ಮಧ್ಯಮ','ತೀವ್ರ'],lv:'ತೀವ್ರತೆಯ ಮಟ್ಟ',
 cls:{'Aphids':'ಹೇನು (Aphids)','Army worm':'ಸೈನಿಕ ಹುಳು (Army worm)','Bacterial Blight':'ಬ್ಯಾಕ್ಟೀರಿಯಾ ಅಂಗಮಾರಿ ರೋಗ','Healthy':'ಆರೋಗ್ಯಕರ ಎಲೆ','Powdery Mildew':'ಬೂದಿ ರೋಗ (Powdery mildew)','Target spot':'ಗುರಿ ಚುಕ್ಕೆ ರೋಗ (Target spot)'},
 adv:{'Aphids':'ಎಲೆಗಳ ಕೆಳಭಾಗವನ್ನು ಪರಿಶೀಲಿಸಿ. ಹೆಚ್ಚು ಬಾಧಿತ ಎಲೆಗಳನ್ನು ತೆಗೆದುಹಾಕಿ ಮತ್ತು ನಿಯಂತ್ರಣದ ಬಗ್ಗೆ ಕೃಷಿ ಅಧಿಕಾರಿಯನ್ನು ಕೇಳಿ.','Army worm':'ಮರಿಹುಳುಗಳು ಮತ್ತು ತಿಂದ ಎಲೆಗಳನ್ನು ಗಮನಿಸಿ, ವಿಶೇಷವಾಗಿ ಸಂಜೆ ಹೊತ್ತಿನಲ್ಲಿ. ನಿಯಂತ್ರಣದ ಬಗ್ಗೆ ಕೃಷಿ ಅಧಿಕಾರಿಯನ್ನು ಕೇಳಿ.','Bacterial Blight':'ಒದ್ದೆ ಹೊಲದಲ್ಲಿ ಕೆಲಸ ಮಾಡುವುದನ್ನು ತಪ್ಪಿಸಿ, ತೀವ್ರ ಬಾಧಿತ ಎಲೆಗಳನ್ನು ತೆಗೆಯಿರಿ. ಚಿಕಿತ್ಸೆಗಾಗಿ ಕೃಷಿ ಅಧಿಕಾರಿಯನ್ನು ಕೇಳಿ.','Healthy':'ರೋಗ ಕಂಡುಬಂದಿಲ್ಲ. ನಿಯಮಿತವಾಗಿ ಪರೀಕ್ಷಿಸುತ್ತಿರಿ.','Powdery Mildew':'ಗಾಳಿಯಾಡುವಂತೆ ನೋಡಿಕೊಳ್ಳಿ, ಗಿಡಗಳು ಒತ್ತೊತ್ತಾಗಿರದಂತೆ ಮಾಡಿ. ಚಿಕಿತ್ಸೆಗಾಗಿ ಕೃಷಿ ಅಧಿಕಾರಿಯನ್ನು ಕೇಳಿ.','Target spot':'ತೀವ್ರ ಚುಕ್ಕೆಗಳಿರುವ ಎಲೆಗಳನ್ನು ತೆಗೆಯಿರಿ, ಎಲೆಗಳು ಒದ್ದೆಯಾಗಿರದಂತೆ ನೋಡಿಕೊಳ್ಳಿ. ಚಿಕಿತ್ಸೆಗಾಗಿ ಕೃಷಿ ಅಧಿಕಾರಿಯನ್ನು ಕೇಳಿ.'}}
};
const COL=['--s0','--s1','--s2','--s3'];
const $=id=>document.getElementById(id);
let lang=localStorage.getItem('lang')||((navigator.language||'').slice(0,2)==='kn'?'kn':'en');
let predict=null,swReady=false,last=null,deferred=null;

function setStatus(){ $('status').textContent=!predict?T[lang].loading:(swReady?T[lang].ready:T[lang].readyOnline); $('status').classList.toggle('ok',!!predict); }
function applyLang(){
  const t=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  $('t_title').textContent=t.title;document.title=t.title;$('t_intro').textContent=t.intro;$('camBtn').textContent=t.cam;$('galBtn').textContent=t.gal;
  $('t_tip').textContent=t.tip;$('t_busy').textContent=t.busy;$('t_photo').textContent=t.photo;$('t_mask').textContent=t.mask;$('t_alt').textContent=t.alt;$('t_disc').textContent=t.disc;
  $('installBtn').textContent=t.install;$('iosHint').textContent=t.ios;setStatus();if(last)render();
}
function render(){
  const t=T[lang],{probs,level,pct,cls}=last,pi=probs.indexOf(Math.max(...probs));
  $('rName').textContent=t.cls[cls];$('rConf').textContent=t.conf+': '+(probs[pi]*100).toFixed(1)+'%';
  $('rSev').style.background=`var(${COL[level]})`;
  $('rLevel').textContent=level===0?t.sev[0]:`${t.lv} ${level}/3: ${t.sev[level]}`;
  $('rPct').textContent=level===0?'':pct.toFixed(1)+'% '+t.affected;
  $('rSev').querySelectorAll('i').forEach((e,i)=>e.classList.toggle('on',i<=level));
  $('rAdvice').textContent=t.adv[cls];
  $('rLow').hidden=probs[pi]>=0.6;$('rLow').textContent=t.low;
  const order=probs.map((p,i)=>[p,i]).sort((a,b)=>b[0]-a[0]).slice(1,3);
  $('rAlt').innerHTML=order.map(([p,i])=>`<div class="alt"><span>${t.cls[CottonCore.CLASSES[i]].split(' (')[0]}</span><div class="bar"><i style="width:${p*100}%"></i></div><span>${(p*100).toFixed(1)}%</span></div>`).join('');
}
function draw(id,rgb,mask){
  const c=$(id),x=c.getContext('2d'),d=x.createImageData(224,224);
  for(let i=0;i<224*224;i++){let r=rgb[i*3],g=rgb[i*3+1],b=rgb[i*3+2];
    if(mask&&mask[i]){r=r*.4+255*.6;g=g*.4;b=b*.4}
    d.data[i*4]=r;d.data[i*4+1]=g;d.data[i*4+2]=b;d.data[i*4+3]=255}
  x.putImageData(d,0,0);
}
async function analyse(file){
  if(!file||!predict)return;
  $('result').hidden=true;$('busy').hidden=false;
  try{
    const bmp=await createImageBitmap(file),sc=Math.min(1,1024/Math.max(bmp.width,bmp.height));
    const w=Math.max(1,Math.round(bmp.width*sc)),h=Math.max(1,Math.round(bmp.height*sc));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(bmp,0,0,w,h);
    const rgb=CottonCore.resizeNearest(cx.getImageData(0,0,w,h).data,w,h);
    await new Promise(r=>setTimeout(r,30));
    const inp=new Float32Array(rgb.length);for(let i=0;i<rgb.length;i++)inp[i]=rgb[i]/255;
    const tin=tf.tensor(inp,[1,224,224,3]),probs=Array.from(predict(tin));tin.dispose();
    const cls=CottonCore.CLASSES[probs.indexOf(Math.max(...probs))],{mask,pct}=CottonCore.infectedArea(rgb);
    last={probs,cls,pct,level:CottonCore.severityLevel(pct,cls)};
    draw('cPhoto',rgb);draw('cMask',rgb,cls==='Healthy'?null:mask);
    render();$('result').hidden=false;$('result').scrollIntoView({behavior:'smooth'});
  }catch(e){console.error(e);alert(T[lang].err)}
  $('busy').hidden=true;
}
async function init(){
  applyLang();
  if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{swReady=true;setStatus()}).catch(()=>{});
  const meta=await (await fetch('model/weights.json')).json(),buf=await (await fetch('model/weights.bin')).arrayBuffer();
  await tf.ready();predict=CottonCore.buildModel(tf,meta,buf);
  const z=tf.zeros([1,224,224,3]);predict(z);z.dispose(); // warm-up
  $('camBtn').disabled=$('galBtn').disabled=false;setStatus();
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;localStorage.setItem('lang',lang);applyLang()});
$('camBtn').onclick=()=>$('camIn').click();$('galBtn').onclick=()=>$('galIn').click();
['camIn','galIn'].forEach(id=>$(id).onchange=e=>{analyse(e.target.files[0]);e.target.value=''});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('installBtn').hidden=false});
$('installBtn').onclick=async()=>{if(deferred){deferred.prompt();deferred=null;$('installBtn').hidden=true}};
if(/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone)$('iosHint').hidden=false;
init();
</script>
</body>
</html>
